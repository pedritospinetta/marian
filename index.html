<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 403 - Cringe Excedido</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f3f5;
            color: #212529;
        }

        .error-container {
            text-align: center;
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 5px solid #fa5252; /* Línea roja de error profesional */
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            color: #fa5252;
            letter-spacing: -2px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 10px 0 20px 0;
        }

        p {
            font-size: 1rem;
            color: #868e96;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .error-code {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 8px 16px;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="error-container">
        <h1>403</h1>
        <h2>Acceso Denegado</h2>
        <p>Lo siento, esta página no está disponible ya que me arrepentí, ¿ok? Me da cringe ser tan cursi.</p>
        <div class="error-code">ERR_CRINGE_LEVEL_CRITICAL</div>
    </div>

</body>
</html>
