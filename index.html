<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Marian</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Lora', serif; 
            background: linear-gradient(135deg, #ffe6f2 0%, #ffccdf 100%);
            color: #4a4a4a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        #view-letter { 
            max-width: 600px; 
            width: 85%; 
            margin: 40px auto; 
            background: #fffafa; 
            padding: 50px 30px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.12); 
            text-align: center;
            border: 1px solid #ffb3c6;
        }

        .message-text { 
            font-family: 'Lora', serif;
            font-size: 1.6rem; 
            line-height: 1.8; 
            color: #4a4a4a; 
            font-style: italic;
        }

        @media (max-width: 600px) {
            #view-letter { padding: 35px 20px; }
            .message-text { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div id="view-letter">
        <div class="message-text">
            Perdón Marian, no lo voy a hacer, te mereces ser feliz y ya dejaste claro que no conmigo no es.
        </div>
    </div>
</body>
</html>
