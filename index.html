<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Marian</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Lora', serif; 
            background: linear-gradient(135deg, #fff0f5 0%, #ffcce0 100%);
            color: #4a4a4a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        .container {
            max-width: 600px; 
            width: 90%; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 50px 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(214, 51, 132, 0.15); 
            border: 1px solid #ffb3c6;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .title-love { 
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem; 
            color: #d63384; 
            font-weight: bold; 
            margin-bottom: 10px; 
            text-shadow: 2px 2px 5px rgba(214, 51, 132, 0.2); 
            animation: pulse 2s infinite;
        }

        .final-msg {
            font-size: 1.8rem;
            color: #7a5c61;
            font-family: 'Dancing Script', cursive;
            background: #fff0f5;
            padding: 25px;
            border-radius: 15px;
            border: 2px dashed #ffb3c6;
            margin-top: 20px;
            line-height: 1.6;
        }

        /* Avatares fijos con Nombres */
        .avatar-container {
            position: fixed;
            bottom: -15px; 
            z-index: 1000;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .avatar-izq { left: 15px; }
        .avatar-der { right: 15px; }

        .avatar-container img {
            width: 350px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        .avatar-name {
            background: #fff0f5;
            color: #d63384;
            padding: 8px 25px;
            border-radius: 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            font-weight: bold;
            border: 2px solid #ffb3c6;
            margin-bottom: -30px;
            z-index: 1001;
            box-shadow: 0 5px 15px rgba(214, 51, 132, 0.3);
        }

        @media (max-width: 1200px) {
            .avatar-container img { width: 220px; }
            .avatar-name { font-size: 1.6rem; margin-bottom: -20px; padding: 5px 15px; }
            .avatar-izq { left: 5px; }
            .avatar-der { right: 5px; opacity: 0.8; }
        }

        @media (max-width: 850px) {
            .avatar-container { display: none; }
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- AVATARES Y NOMBRES -->
    <div class="avatar-container avatar-izq">
        <div class="avatar-name">M4RIW</div>
        <img src="imagen_2026-08-21_150745802.-fotor-enhance-2026082115935.png" alt="M4riw">
    </div>

    <div class="avatar-container avatar-der">
        <div class="avatar-name">ALE</div>
        <img src="imagen_2026-08-21_151214865.-fotor-enhance-20260821151304.png" alt="Ale">
    </div>

    <!-- CONTENIDO CENTRAL -->
    <div class="container">
        <div class="title-love">MARIAN</div>
        <div class="final-msg">
            ✨ PÁGINA FINALIZADA ✨<br>
            <span style="font-size: 1.3rem; font-family: 'Lora', serif; color: #4a4a4a; display: block; margin-top: 10px;">
                Gracias por completar todo este recorrido. ❤️
            </span>
        </div>
    </div>

</body>
</html>
